[tool.ruff]
line-length = 100
target-version = "py311"
# The vendored virtualenv must never be linted.
extend-exclude = [".venv"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors/warnings (E, W), isort (I), pyupgrade (UP),
# flake8-bugbear (B). A pragmatic, low-noise default set.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
