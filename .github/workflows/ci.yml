# GitHub Actions CI — AI Price Checker
#
# Mirrors .gitlab-ci.yml so the frontend + backend test suites gate merges
# into master. See frontend/TESTING.md for what the frontend suite covers;
# the backend suite lives in backend/tests/.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Reproducible install from the committed lockfile.
        run: npm ci

      - name: Run tests with coverage
        # CI=true makes react-scripts run once (no watch) and exit non-zero
        # on failure, so a failing suite fails the job and blocks the merge.
        run: CI=true npm test -- --coverage --watchAll=false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend/coverage/
          retention-days: 7

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Reproducible install from the committed lockfile.
        run: npm ci

      - name: Build production bundle
        run: CI=true npm run build

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        # Override the workflow-level `frontend` default for this job.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile (python:3.11-slim).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
