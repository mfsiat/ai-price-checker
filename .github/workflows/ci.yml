# GitHub Actions CI — AI Price Checker
#
# Mirrors .gitlab-ci.yml so the frontend test suite gates merges into master.
# See frontend/TESTING.md for what is covered.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # The project does not commit a lockfile (see root .gitignore), so
        # use `npm install` rather than `npm ci`, which requires one.
        run: npm install

      - name: Run tests with coverage
        # CI=true makes react-scripts run once (no watch) and exit non-zero
        # on failure, so a failing suite fails the job and blocks the merge.
        run: CI=true npm test -- --coverage --watchAll=false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend/coverage/
          retention-days: 7

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # The project does not commit a lockfile (see root .gitignore), so
        # use `npm install` rather than `npm ci`, which requires one.
        run: npm install

      - name: Build production bundle
        run: CI=true npm run build
